[package]
name = "productivo"
version = "0.1.0"
edition = "2021"
description = "A single-binary terminal productivity dashboard: habits, todos, calendar, ideas, pomodoro, and a pixel pet that levels up with your focus sessions"
license = "MIT"
repository = "https://github.com/Shauryaroks/productivo"
readme = "README.md"
keywords = ["tui", "productivity", "pomodoro", "habits", "dashboard"]
categories = ["command-line-utilities"]
exclude = ["HANDOVER.md", "assets/make_skins.py"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
chrono = "0.4"
directories = "5"
image = { version = "0.25", default-features = false, features = ["gif"] }

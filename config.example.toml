# Copy to your config dir as config.toml:
#   Linux:   ~/.config/productivo/config.toml
#   macOS:   ~/Library/Application Support/productivo/config.toml
#   Windows: %APPDATA%\productivo\config\config.toml

# Home-screen panel order — panels fill bento slots by position:
#   1st: left rail top        2nd: left rail middle (slim strip)
#   3rd: left rail bottom     4th: center hero (largest)
#   5th: right top            6th: right bottom
# On terminals narrower than 110 columns the layout degrades to an equal
# 2x3 grid (first three = left column, last three = right column).
panels = ["habits", "pomodoro", "ideas", "todos", "calendar", "stats"]

# The app never paints a background — set your terminal emulator's opacity
# (e.g. alacritty/kitty background_opacity) for the translucent glass look.

[pomodoro]
focus_min = 25
break_min = 5
# Sound file played when a timer ends (wav/ogg/mp3 — whatever your system
# player supports; tries paplay, pw-play, aplay, afplay). Unset = terminal bell.
# sound = "/home/you/sounds/chime.wav"

# In the app: +/- adjusts focus length, [/] adjusts break length (next session).

[theme]
# Optional hex overrides (defaults: Catppuccin Mocha)
# accent = "#cba6f7"
# green  = "#a6e3a1"
# red    = "#f38ba8"
# yellow = "#f9e2af"
# blue   = "#89b4fa"
# peach  = "#fab387"
